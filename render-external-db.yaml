# Render blueprint - FastAPI + static web app, with the database hosted
# ELSEWHERE (Neon, Supabase, or any managed PostgreSQL).
#
# Use this file instead of render.yaml when you need the database to outlive
# 30 days. Render's own free PostgreSQL expires 30 days after creation, which
# is shorter than the gap between a September deployment and a December event.
#
# On Render: New -> Blueprint, and set the blueprint file to
# `render-external-db.yaml`. Then paste your database's connection string into
# DATABASE_URL in the dashboard.
#
# Nothing secret lives here. JWT_SECRET_KEY is generated by Render; the
# database URL and the seed passwords are set by you in the dashboard.

services:
  # --------------------------------------------------------------- API ---
  - type: web
    name: mplad-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      # Paste the full connection string from your database provider.
      # Neon gives you: postgresql://user:pass@host/db?sslmode=require
      # The app rewrites the prefix for SQLAlchemy, so paste it unchanged.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      # Populate the database on first boot so the site is never blank.
      # Turn this OFF once the data is in - see docs/DEPLOYMENT.md.
      - key: SEED_ON_STARTUP
        value: "true"
      - key: SEED_ON_STARTUP_PROJECTS
        value: "400"
      # Set these four in the dashboard so you know the demo passwords.
      # Leave them blank and the seed generates random ones you cannot see.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_AUDITOR_PASSWORD
        sync: false
      - key: SEED_OFFICER_PASSWORD
        sync: false
      - key: SEED_CITIZEN_PASSWORD
        sync: false
      # Must match the web service's URL. Set after the first deploy.
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_DELIVERY
        value: console
      - key: AI_ENHANCEMENT_ENABLED
        value: "false"

  # --------------------------------------------------------- Web app ---
  - type: web
    name: mplad-web
    runtime: static
  
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API's public URL plus /api. Set after the API deploys.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: every unknown path serves index.html so that
      # /admin/scheme/42 works on a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
