# Render blueprint - PostgreSQL + FastAPI + the static web app.
#
# Deploy: push this repository to GitHub, then on Render choose
# New -> Blueprint and point it at the repo. Render reads this file and
# creates all three services. See docs/DEPLOYMENT.md for the walk-through.
#
# Nothing secret lives here. JWT_SECRET_KEY is generated by Render, the
# database URL is injected from the managed database, and the seed passwords
# are set by you in the dashboard.

databases:
  - name: mplad-db
    databaseName: mplad_insight
    user: mplad
    plan: free

services:
  # --------------------------------------------------------------- API ---
  - type: web
    name: mplad-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mplad-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      # Populate the database on first boot so the demo is never blank.
      - key: SEED_ON_STARTUP
        value: "true"
      - key: SEED_ON_STARTUP_PROJECTS
        value: "400"
      # Set these four in the dashboard so you know the demo passwords.
      # Leave them blank and the seed generates random ones you cannot see.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_AUDITOR_PASSWORD
        sync: false
      - key: SEED_OFFICER_PASSWORD
        sync: false
      - key: SEED_CITIZEN_PASSWORD
        sync: false
      # Must match the web service's URL. Update after the first deploy.
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_DELIVERY
        value: console
      - key: AI_ENHANCEMENT_ENABLED
        value: "false"

  # --------------------------------------------------------- Web app ---
  - type: web
    name: mplad-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API's public URL plus /api. Set after the API deploys.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: every unknown path serves index.html so that
      # /admin/scheme/42 works on a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
